[project]
name = "mavradar-edge"
version = "0.1.0"
description = "MavRadar field node: radar detection and event uplink"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema[format-nongpl]>=4.23",
    "types-jsonschema",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["mavradar_edge", "tests"]
