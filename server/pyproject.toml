[project]
name = "mavradar-server"
version = "0.1.0"
description = "MavRadar ingest API and alert fan-out"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema[format-nongpl]>=4.23",
    "types-jsonschema",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["app", "tests"]
