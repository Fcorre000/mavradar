name: edge

# Runs on every pull request, not only ones that touch edge/ or contract/: these checks are required
# on main, and a required check that never runs blocks the merge. The whole run is about a minute.
on:
  pull_request:

jobs:
  check:
    name: edge (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor the code is written to; 3.13 is what the node runs (Raspberry Pi OS Trixie).
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.0"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest
